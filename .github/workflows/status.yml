name: Independent service status
on:
  push:
    branches: [main]
    paths-ignore: ['site/status.json']
  schedule:
    # A fallback only. GitHub runs this timer when it chooses, sometimes hours apart,
    # so the run below starts the next one itself (see the last step).
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: status-pages
  cancel-in-progress: false
jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monitoring model
        run: node --test scripts/status.test.mjs
      - name: Check public services
        env:
          CLIENT_SITE_CHECK_URL: ${{ secrets.CLIENT_SITE_CHECK_URL }}
          CLIENT_SITE_CONTENT_MARKER: ${{ secrets.CLIENT_SITE_CONTENT_MARKER }}
          CLIENT_CUSTOM_DOMAIN_CHECK_URL: ${{ secrets.CLIENT_CUSTOM_DOMAIN_CHECK_URL }}
          CLIENT_CUSTOM_DOMAIN_CONTENT_MARKER: ${{ secrets.CLIENT_CUSTOM_DOMAIN_CONTENT_MARKER }}
        run: node scripts/monitor.mjs
      - name: Save latest report
        run: |
          git config user.name "FastSites status bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add site/status.json
          # Commit only when something other than the timestamp changed, so history is not 280 commits a day.
          git diff --cached --quiet -I'"checkedAt"' || (git commit -m "Update status report" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub's scheduler is best effort and was running this every 4 to 6 hours, but the
      # page ignores any report older than 15 minutes. So each run waits, then starts the
      # next one itself. workflow_dispatch is allowed with the built-in token. If a run is
      # already queued (the cron fired, say) it will carry the chain on, so do not start another.
      - name: Start the next check
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 240
          waiting=$(gh run list --workflow status.yml --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$waiting" = "0" ]; then gh workflow run status.yml --ref main; else echo "A run is already waiting; it will continue the chain."; fi
