name: Independent service status
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: status-pages
  cancel-in-progress: false
jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public services
        run: node scripts/monitor.mjs
      - name: Save latest report
        run: |
          git config user.name "FastSites status bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add site/status.json
          git diff --cached --quiet || (git commit -m "Update status report" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
