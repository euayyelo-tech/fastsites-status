name: Independent service status
on:
  push:
    branches: [main]
    paths-ignore: ['site/status.json']
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: status-pages
  cancel-in-progress: false
jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monitoring model
        run: node --test scripts/status.test.mjs
      - name: Check public services
        env:
          CLIENT_SITE_CHECK_URL: ${{ secrets.CLIENT_SITE_CHECK_URL }}
          CLIENT_SITE_CONTENT_MARKER: ${{ secrets.CLIENT_SITE_CONTENT_MARKER }}
          CLIENT_CUSTOM_DOMAIN_CHECK_URL: ${{ secrets.CLIENT_CUSTOM_DOMAIN_CHECK_URL }}
          CLIENT_CUSTOM_DOMAIN_CONTENT_MARKER: ${{ secrets.CLIENT_CUSTOM_DOMAIN_CONTENT_MARKER }}
        run: node scripts/monitor.mjs
      - name: Save latest report
        run: |
          git config user.name "FastSites status bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add site/status.json
          git diff --cached --quiet || (git commit -m "Update status report" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
